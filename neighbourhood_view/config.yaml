name: "Neighbourhood View"
description: "An isometric drawing of the streets around your home, as a page and a dashboard card"
version: "0.24.1"
slug: "neighbourhood_view"
url: "https://github.com/thewhale21/HA_Addons/tree/main/neighbourhood_view"
arch:
  - aarch64
  - amd64
init: false
startup: "services"
homeassistant_api: true
hassio_api: true
ingress: true
panel_icon: "mdi:map-marker-radius"
panel_title: "Neighbourhood View"
ports:
  "8099/tcp": null
ports_description:
  "8099/tcp": "Add-on API (optional; the web page doesn't need it)"
image: "ghcr.io/thewhale21/{arch}-addon-neighbourhood-view"
# Home Assistant's config folder: the dashboard card goes in its www folder (src/card_install.py)
map:
  - type: homeassistant_config
    read_only: false
