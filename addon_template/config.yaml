name: "Add-on Template"
description: "A starting point for a Home Assistant add-on with a web page"
version: "0.1.1"
slug: "addon_template"
url: "https://github.com/thewhale21/HA_Addons/tree/main/addon_template"
arch:
  - aarch64
  - amd64
init: false
startup: "services"
homeassistant_api: true
hassio_api: true
ingress: true
panel_icon: "mdi:puzzle"
panel_title: "Add-on Template"
ports:
  "8099/tcp": null
ports_description:
  "8099/tcp": "Add-on API (optional; the web page doesn't need it)"
image: "ghcr.io/thewhale21/{arch}-addon-addon-template"
options:
  example_option: "hello"
schema:
  example_option: str
